<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HouseTrack | Tenants and Contracts</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <h2>HouseTrack</h2>
      <span>Owner</span>
    </div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="units.html">Units and Properties</a>
      <a href="tenants.html" class="active">Tenants and Contracts</a>
      <a href="#">Payments</a>
      <a href="#">Repair Requests</a>
      <a href="#">Reports</a>
    </nav>
    <button id="logoutButton" class="logout">Log out</button>
  </aside>

  <main class="content">
    <h1>Tenants and Contracts</h1>

    <div class="tabs">
      <button class="tab active">Tenants</button>
      <button class="tab" disabled title="Not available yet">Contracts</button>
    </div>

    <div class="toolbar">
      <input id="search" placeholder="Search name or email">
      <button class="btn btn-outline" onclick="load()">Filter</button>
      <button class="btn btn-primary" onclick="openForm()">Add tenant</button>
    </div>

    <div class="form-panel" id="formPanel">
      <h3 id="formTitle">Add tenant</h3>
      <div class="form-grid">
        <input id="name" placeholder="Full name">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Temporary password">
        <input id="contact" placeholder="Contact number">
        <input id="ecName" placeholder="Emergency contact name">
        <input id="ecNumber" placeholder="Emergency contact number">
        <input id="idType" placeholder="Valid ID type">
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="save()">Save</button>
        <button class="btn btn-outline" onclick="resetForm()">Cancel</button>
      </div>
      <p id="msg" class="form-msg"></p>
    </div>

    <section class="panel">
      <table>
        <thead>
          <tr><th>Name</th><th>Email</th><th>Contact</th><th>Emergency contact</th><th>ID type</th><th>Actions</th></tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </section>
  </main>

<script>
let editId = null;
let tenants = [];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load() {
  const q = document.getElementById('search').value;
  const res = await fetch('/api/tenants?q=' + encodeURIComponent(q));
  tenants = await res.json();
  document.getElementById('list').innerHTML = tenants.length ? tenants.map(t => `
    <tr>
      <td>${esc(t.full_name)}</td>
      <td>${esc(t.email)}</td>
      <td>${esc(t.contact_number)}</td>
      <td>${esc(t.emergency_contact_name)} ${esc(t.emergency_contact_number)}</td>
      <td>${esc(t.valid_id_type)}</td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="edit(${t.tenant_id})">Edit</button>
        <button class="btn btn-outline btn-sm" onclick="archive(${t.tenant_id})">Archive</button>
      </td>
    </tr>`).join('')
    : '<tr><td colspan="6" class="empty">No tenants found.</td></tr>';
}

function openForm() {
  resetForm();
  document.getElementById('formPanel').classList.add('open');
  document.getElementById('name').focus();
}

async function save() {
  const body = {
    full_name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
    contact_number: document.getElementById('contact').value.trim(),
    emergency_contact_name: document.getElementById('ecName').value.trim(),
    emergency_contact_number: document.getElementById('ecNumber').value.trim(),
    valid_id_type: document.getElementById('idType').value.trim()
  };
  const res = await fetch(editId ? '/api/tenants/' + editId : '/api/tenants', {
    method: editId ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  document.getElementById('msg').textContent = data.error || '';
  if (!data.error) { resetForm(); load(); }
}

function edit(id) {
  const t = tenants.find(x => x.tenant_id === id);
  if (!t) return;
  editId = t.tenant_id;
  document.getElementById('formTitle').textContent = 'Edit tenant';
  document.getElementById('name').value = t.full_name;
  document.getElementById('email').value = t.email;
  document.getElementById('password').value = '';
  document.getElementById('password').disabled = true;
  document.getElementById('contact').value = t.contact_number;
  document.getElementById('ecName').value = t.emergency_contact_name || '';
  document.getElementById('ecNumber').value = t.emergency_contact_number || '';
  document.getElementById('idType').value = t.valid_id_type || '';
  document.getElementById('msg').textContent = '';
  const panel = document.getElementById('formPanel');
  panel.classList.add('open');
  panel.scrollIntoView({ behavior: 'smooth' });
}

function resetForm() {
  editId = null;
  document.getElementById('formTitle').textContent = 'Add tenant';
  document.getElementById('password').disabled = false;
  ['name','email','password','contact','ecName','ecNumber','idType']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('msg').textContent = '';
  document.getElementById('formPanel').classList.remove('open');
}

async function archive(id) {
  if (!confirm('Archive this tenant?')) return;
  await fetch('/api/tenants/' + id + '/archive', { method: 'PUT' });
  load();
}

document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });

document.getElementById('logoutButton').addEventListener('click', async () => {
  const response = await fetch('/auth/logout', { method: 'POST' });
  if (response.ok) window.location.href = '/login.html';
});

load();
</script>
</body>
</html>
