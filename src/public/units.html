<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HouseTrack | Units and Properties</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <h2>HouseTrack</h2>
      <span>Owner</span>
    </div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="units.html" class="active">Units and Properties</a>
      <a href="tenants.html">Tenants and Contracts</a>
      <a href="#">Payments</a>
      <a href="#">Repair Requests</a>
      <a href="#">Reports</a>
    </nav>
    <button id="logoutButton" class="logout">Log out</button>
  </aside>

  <main class="content">
    <h1>Units and Properties</h1>

    <div class="tabs">
      <button class="tab active">Units</button>
      <button class="tab" disabled title="Not available yet">Properties</button>
    </div>

    <div class="toolbar">
      <input id="search" placeholder="Search unit name">
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option>Vacant</option>
        <option>Occupied</option>
        <option>Under Repair</option>
      </select>
      <button class="btn btn-outline" onclick="render()">Filter</button>
      <button class="btn btn-primary" onclick="openForm()">Add unit</button>
    </div>

    <div class="form-panel" id="formPanel">
      <h3 id="formTitle">Add unit</h3>
      <div class="form-grid">
        <input id="property" type="number" placeholder="Property ID (1 or 2)">
        <input id="name" placeholder="Unit name">
        <input id="rent" type="number" step="0.01" placeholder="Monthly rent">
        <select id="status">
          <option>Vacant</option>
          <option>Occupied</option>
          <option>Under Repair</option>
        </select>
        <input id="description" placeholder="Description">
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="save()">Save</button>
        <button class="btn btn-outline" onclick="resetForm()">Cancel</button>
      </div>
      <p id="msg" class="form-msg"></p>
    </div>

    <section class="panel">
      <table>
        <thead>
          <tr><th>Property</th><th>Unit</th><th>Description</th><th>Rent</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </section>
  </main>

<script>
let editId = null;
let units = [];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function peso(n) {
  return '₱' + Number(n || 0).toLocaleString('en-PH', { maximumFractionDigits: 2 });
}

function badgeClass(status) {
  const s = String(status || '').toLowerCase();
  if (s === 'occupied') return 'occupied';
  if (s === 'vacant') return 'vacant';
  return 'repair';
}

async function api(url, options) {
  const res = await fetch(url, options);
  if (res.redirected) { window.location = '/login.html'; return null; }
  return res.json();
}

async function load() {
  const data = await api('/api/units');
  if (!data) return;
  units = data;
  render();
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const st = document.getElementById('filterStatus').value;
  const rows = units.filter(u =>
    (!q || String(u.unit_name).toLowerCase().includes(q)) &&
    (!st || u.status === st)
  );

  document.getElementById('list').innerHTML = rows.length ? rows.map(u => `
    <tr>
      <td>${esc(u.property_id)}</td>
      <td>${esc(u.unit_name)}</td>
      <td>${esc(u.description)}</td>
      <td>${peso(u.monthly_rent)}</td>
      <td><span class="badge ${badgeClass(u.status)}">${esc(String(u.status).toUpperCase())}</span></td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="edit(${u.unit_id})">Edit</button>
        <button class="btn btn-outline btn-sm" onclick="archive(${u.unit_id})">Archive</button>
      </td>
    </tr>`).join('')
    : '<tr><td colspan="6" class="empty">No units found.</td></tr>';
}

function openForm() {
  resetForm();
  document.getElementById('formPanel').classList.add('open');
  document.getElementById('property').focus();
}

async function save() {
  const body = {
    property_id: document.getElementById('property').value,
    unit_name: document.getElementById('name').value.trim(),
    monthly_rent: document.getElementById('rent').value,
    status: document.getElementById('status').value,
    description: document.getElementById('description').value.trim()
  };
  const data = await api(editId ? '/api/units/' + editId : '/api/units', {
    method: editId ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!data) return;
  const failed = !!data.error || /required|must|exists|not exist|not found|error/i.test(data.message || '');
  document.getElementById('msg').textContent = failed ? (data.error || data.message) : '';
  if (!failed) { resetForm(); load(); }
}

function edit(id) {
  const u = units.find(x => x.unit_id === id);
  if (!u) return;
  editId = u.unit_id;
  document.getElementById('formTitle').textContent = 'Edit unit';
  document.getElementById('property').value = u.property_id;
  document.getElementById('name').value = u.unit_name;
  document.getElementById('rent').value = u.monthly_rent;
  document.getElementById('status').value = u.status;
  document.getElementById('description').value = u.description || '';
  document.getElementById('msg').textContent = '';
  const panel = document.getElementById('formPanel');
  panel.classList.add('open');
  panel.scrollIntoView({ behavior: 'smooth' });
}

function resetForm() {
  editId = null;
  document.getElementById('formTitle').textContent = 'Add unit';
  ['property','name','rent','description'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('status').value = 'Vacant';
  document.getElementById('msg').textContent = '';
  document.getElementById('formPanel').classList.remove('open');
}

async function archive(id) {
  if (!confirm('Archive this unit?')) return;
  await api('/api/units/' + id + '/archive', { method: 'PATCH' });
  load();
}

document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') render(); });

document.getElementById('logoutButton').addEventListener('click', async () => {
  const response = await fetch('/auth/logout', { method: 'POST' });
  if (response.ok) window.location.href = '/login.html';
});

load();
</script>
</body>
</html>
